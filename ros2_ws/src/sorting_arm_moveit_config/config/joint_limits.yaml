# joint_limits.yaml allows the dynamics properties specified in the URDF to be overwritten or augmented as needed

# For beginners, we downscale velocity and acceleration limits.
# You can always specify higher scaling factors (<= 1.0) in your motion requests.  # Increase the values below to 1.0 to always move at maximum speed.
default_velocity_scaling_factor: 0.5
default_acceleration_scaling_factor: 0.5

# Specific joint properties can be changed with the keys [max_position, min_position, max_velocity, max_acceleration]
# Joint limits can be turned off with [has_velocity_limits, has_acceleration_limits]
# Position limits: MoveIt-only (the URDF/controllers keep the UR's +-2pi). They pin planning to the
# elbow-up, gripper-down branch the pick/place poses use, centred on those poses. With the full
# +-2pi ranges, IK goals jumped between branches and OMPL had to swing the arm through the elbow
# singularity, producing self-colliding paths and timeouts. The ros2_control initial_positions
# (sorting_arm.ros2_control.xacro) start inside these ranges.
# Acceleration limits: UR arms have no published joint acceleration limits; 5.0 rad/s^2 matches
# ur_moveit_config. MoveIt's time-optimal parameterization (Jazzy) fails without them.
joint_limits:
  elbow_joint:
    has_position_limits: true
    min_position: 0.1
    max_position: 3.1416
    has_velocity_limits: true
    max_velocity: 3.1415926535897931
    has_acceleration_limits: true
    max_acceleration: 5.0
  shoulder_lift_joint:
    has_position_limits: true
    min_position: -3.1416
    max_position: 0.0
    has_velocity_limits: true
    max_velocity: 2.0943951023931953
    has_acceleration_limits: true
    max_acceleration: 5.0
  shoulder_pan_joint:
    has_position_limits: true
    min_position: -1.5708
    max_position: 4.7124
    has_velocity_limits: true
    max_velocity: 2.0943951023931953
    has_acceleration_limits: true
    max_acceleration: 5.0
  wrist_1_joint:
    has_position_limits: true
    min_position: -6.2832
    max_position: 0.0
    has_velocity_limits: true
    max_velocity: 3.1415926535897931
    has_acceleration_limits: true
    max_acceleration: 5.0
  wrist_2_joint:
    has_position_limits: true
    min_position: 2.4
    max_position: 6.2832
    has_velocity_limits: true
    max_velocity: 3.1415926535897931
    has_acceleration_limits: true
    max_acceleration: 5.0
  wrist_3_joint:
    has_position_limits: true
    min_position: -0.5
    max_position: 6.0
    has_velocity_limits: true
